name: Tests

on:
  push:
    branches: [main, complete-and-verify]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q EmotionDetection tests server.py
      - name: Run offline unit and route tests
        run: python -m unittest EmotionDetection.test_emotion_detection tests.test_server -v
